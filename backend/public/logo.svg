<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Echo logo">
  <defs>
    <linearGradient id="echoGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <!-- rounded-square background -->
  <rect width="512" height="512" rx="112" fill="url(#echoGrad)"/>
  <!-- symmetric sound wave: tall in the centre, decaying outward = echo -->
  <g fill="#FFFFFF">
    <rect x="238" y="116" width="36" height="280" rx="18"/>
    <rect x="174" y="146" width="36" height="220" rx="18"/>
    <rect x="302" y="146" width="36" height="220" rx="18"/>
    <rect x="110" y="181" width="36" height="150" rx="18"/>
    <rect x="366" y="181" width="36" height="150" rx="18"/>
    <rect x="46"  y="211" width="36" height="90"  rx="18" fill-opacity="0.7"/>
    <rect x="430" y="211" width="36" height="90"  rx="18" fill-opacity="0.7"/>
  </g>
</svg>
