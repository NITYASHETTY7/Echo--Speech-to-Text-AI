            // (removed) get-recording-status effect - replaced by 'request-pill-state'
            // in the single state-channel effect above (Phase 1).

            useEffect(() => {
                // Notify Electron about size changes
                console.log('[Pill Size] State changed:', { isExpanded, isFullyExpanded, state });
                if (window.electron?.ipcRenderer) {
                    if (isFullyExpanded && state === 'idle') {
                        // Fully expanded state with input selector
                        console.log('[Pill Size] Sending pill-expand with width 350');
                        window.electron.ipcRenderer.send('pill-expand', 350);
                    } else if (!isExpanded && !isFullyExpanded && state === 'idle') {
                        console.log('[Pill Size] Sending pill-compact');
                        window.electron.ipcRenderer.send('pill-compact');
                    } else if (state === 'recording' || state === 'processing') {
                        console.log('[Pill Size] Sending pill-expand with width 130 (recording/processing)');
                        window.electron.ipcRenderer.send('pill-expand', 130);
                    } else if (state === 'error') {
                        // Wider so the real error message is readable (BUG-07)
                        window.electron.ipcRenderer.send('pill-expand', 260);
                    } else if (state === 'success') {
                        // Wider when auto-paste failed and we show "press ⌘V" (BUG-05)
                        const w = (statusMessage && statusMessage !== 'Copied!') ? 260 : 130;
                        window.electron.ipcRenderer.send('pill-expand', w);
                    } else if (isExpanded && state === 'idle') {
                        console.log('[Pill Size] Sending pill-expand with width 130 (expanded idle)');
                        window.electron.ipcRenderer.send('pill-expand', 130);
                    }
                }
            }, [isExpanded, isFullyExpanded, state, statusMessage]);

            const loadDevices = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(track => track.stop());
                    
                    const deviceList = await navigator.mediaDevices.enumerateDevices();
                    const audioInputs = deviceList
                        .filter(device => device.kind === 'audioinput')
                        .map(device => ({
                            deviceId: device.deviceId,
                            label: device.label.replace(/\s*\(.*?\)\s*/g, '').trim() || `Microphone ${device.deviceId.slice(0, 5)}`
                        }));
                    
                    setDevices(audioInputs);
                    if (audioInputs.length > 0 && !selectedMic) {
                        setSelectedMic(audioInputs[0].deviceId);
                    }
                } catch (err) {
                    console.error('Error loading devices:', err);
                }
            };

            const cleanupRecording = () => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                    streamRef.current = null;
                }
                if (mediaRecorderRef.current) {
                    mediaRecorderRef.current = null;
                }
                audioChunksRef.current = [];
            };

            // Start recording. In Electron, main owns capture (SoX) and we just send
            // the command; state arrives via 'pill-state'. Browser uses MediaRecorder.
            const startRecording = async () => {
                if (window.electron?.ipcRenderer) {
                    window.electron.ipcRenderer.send('set-model', modelRef.current);
                    window.electron.ipcRenderer.send('recording-start');
                    return;
                }
                try {
                    cleanupRecording();
                    const constraints = {
                        audio: selectedMic ? { deviceId: { exact: selectedMic } } : true
                    };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    streamRef.current = stream;
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];
                    mediaRecorderRef.current.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) {
                            audioChunksRef.current.push(event.data);
                        }
                    };
                    mediaRecorderRef.current.onstop = async () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        await transcribeAudio(audioBlob);
                        cleanupRecording();
                    };
                    mediaRecorderRef.current.start(10000);
                    setState('recording');
                    setRecordingTime(0);
                } catch (error) {
                    console.error('Error starting recording:', error);
                    setStatusMessage('Mic error');
                    setState('error');
                    cleanupRecording();
                }
            };

            const stopRecording = () => {
                if (window.electron?.ipcRenderer) {
                    window.electron.ipcRenderer.send('recording-stop');
                    return;
                }
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                    mediaRecorderRef.current.stop();
                    setState('processing');
                }
            };

            const transcribeAudio = async (audioBlob) => {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                formData.append('model', model);

                try {
                    const response = await authedFetch('/api/transcribe', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        console.error('HTTP error:', response.status);
                        setState('error');
                        return;
                    }

                    const data = await response.json();

                    if (data.success && data.text) {
                        console.log('Transcription successful! Text:', data.text.substring(0, 50));
                        await navigator.clipboard.writeText(data.text);
                        console.log('Text copied to clipboard');
                        // Trigger auto-paste via Electron (for regular button-triggered transcription too)
                        if (window.electron?.ipcRenderer) {
                            console.log('Sending transcription-complete IPC event...');
                            window.electron.ipcRenderer.send('transcription-complete', data.text);
                            console.log('IPC event sent!');
                        } else {
                            console.log('No electron IPC available');
                        }
                        setState('success');
                    } else {
                        console.error('Transcription failed:', data.error || 'Unknown error');
                        setState('error');
                    }
                } catch (error) {
                    console.error('Transcription error:', error);
                    setState('error');
                }
            };

            const handlePress = () => {
                if (state === 'idle') {
                    if (!isExpanded) {
                        setIsExpanded(true);
                        resetInactivityTimer();
                    } else {
                        startRecording();
                        if (inactivityTimerRef.current) {
                            clearTimeout(inactivityTimerRef.current);
                        }
                    }
                } else if (state === 'recording') {
                    stopRecording();
                }
            };

            const handleContainerClick = () => {
                if (!isExpanded && state === 'idle') {
                    setIsExpanded(true);
                    resetInactivityTimer();
                }
            };

            const handleUserInteraction = () => {
                if (isExpanded && state === 'idle') {
                    resetInactivityTimer();
                }
            };
            
            
            const openMainWindow = () => {
                if (window.electron?.ipcRenderer) {
                    window.electron.ipcRenderer.send('show-main-window');
                }
                handleUserInteraction();
            };

            const getButtonIcon = () => {
                switch (state) {
                    case 'recording':
                        return (
                            <svg viewBox="0 0 24 24" fill="white" stroke="white" strokeWidth="0">
                                <rect x="7" y="7" width="10" height="10" rx="1"/>
                            </svg>
                        );
                    case 'processing':
                        return <div className="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></div>;
                    case 'success':
                        return (
                            <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        );
                    case 'error':
                        return (
                            <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        );
                    default:
                        return (
                            <svg viewBox="0 0 24 24" fill="white" stroke="white" strokeWidth="1.5">
                                <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" fill="white"/>
                                <path d="M19 11v1a7 7 0 0 1-14 0v-1" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round"/>
                                <line x1="12" y1="19" x2="12" y2="22" stroke="white" strokeWidth="1.5" strokeLinecap="round"/>
                            </svg>
                        );
                }
            };

            const getButtonStyle = () => {
                switch (state) {
                    case 'recording':
                        return 'bg-red-600 bg-opacity-80 hover:bg-opacity-90';
                    case 'processing':
                        return 'bg-white bg-opacity-20';
                    case 'success':
                        return 'bg-white bg-opacity-20';
                    case 'error':
                        return 'bg-white bg-opacity-20';
                    default:
                        return 'bg-white bg-opacity-20 hover:bg-opacity-30';
                }
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            // BUG-07: show the real error text, capped so it fits the pill.
            const cap = (s, n = 40) => (s && s.length > n ? s.slice(0, n - 1) + '…' : s);
            // BUG-05: main sends 'Copied!' on success, or 'Copied — press ⌘V' if auto-paste failed.
            const pasteFailed = state === 'success' && !!statusMessage && statusMessage !== 'Copied!';

            const handleMinimize = () => {
                setIsExpanded(false);
                if (inactivityTimerRef.current) {
                    clearTimeout(inactivityTimerRef.current);
                }
            };

            const selectedDevice = devices.find(d => d.deviceId === selectedMic);
            
            // (hover / fullyExpanded / showMenu state moved to the top of the component - BUG-19)

            // Handle hover state IPC for window resizing
            useEffect(() => {
                console.log('[Pill Hover] Hover state changed:', { isHovered, isExpanded, isFullyExpanded, state });
                if (window.electron?.ipcRenderer) {
                    // Only handle hover states when NOT fully expanded
                    if (!isExpanded && !isFullyExpanded && state === 'idle') {
                        if (isHovered) {
                            console.log('[Pill Hover] Sending pill-hover-expand');
                            window.electron.ipcRenderer.send('pill-hover-expand');
                        } else {
                            console.log('[Pill Hover] Sending pill-compact');
                            window.electron.ipcRenderer.send('pill-compact');
                        }
                    }
                }
            }, [isHovered, isExpanded, isFullyExpanded, state]);

            // Click handler for the pill - clicking anywhere starts recording
            const handlePillClick = () => {
                if (state === 'idle') {
                    startRecording();
                    setIsExpanded(true);
                    setIsHovered(false);
                }
            };

            // Determine the pill class based on state
            const getPillClass = () => {
                if (state === 'recording') return 'recording';
                if (state === 'processing' || state === 'success' || state === 'error') return 'expanded';
                if (isFullyExpanded && state === 'idle') return 'fully-expanded';
                if (isHovered && !isExpanded && !isFullyExpanded) return 'hover-expanded';
                return 'compact';
            };

            // Render content based on state
            const renderContent = () => {
                if (state === 'recording') {
                    return (
                        <div className="pill-recording-layout">
                            <div className="pill-waveform">
                                <LiveWaveform
                                    active={true}
                                    simulateAudio={false}
                                    mode="static"
                                    height={18}
                                    barWidth={2}
                                    barGap={2}
                                    barColor="rgba(255, 255, 255, 0.8)"
                                />
                            </div>
                            <span className="pill-time" style={nearLimit ? { color: '#f87171', fontWeight: 600 } : undefined}>{formatTime(recordingTime)}</span>
                        </div>
                    );
                }

                if (state === 'processing') {
                    return (
                        <div className="pill-inner-content">
                            <div className="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                            <span className="pill-status-text">Transcribing...</span>
                        </div>
                    );
                }
                
                if (state === 'success') {
                    // BUG-05: amber "clipboard" state when auto-paste failed; green check otherwise.
                    const color = pasteFailed ? '#fbbf24' : '#4ade80';
                    return (
                        <div className="pill-inner-content">
                            {pasteFailed ? (
                                <svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ width: '14px', height: '14px' }}>
                                    <rect x="9" y="9" width="13" height="13" rx="2"/>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                </svg>
                            ) : (
                                <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" strokeWidth="2.5" strokeLinecap="round" style={{ width: '14px', height: '14px' }}>
                                    <polyline points="20 6 9 17 4 12"/>
                                </svg>
                            )}
                            <span className="pill-status-text" style={{ color }}>{cap(statusMessage || 'Copied!', 40)}</span>
                        </div>
                    );
                }
                
                if (state === 'error') {
                    return (
                        <div className="pill-inner-content">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#f87171" strokeWidth="2.5" strokeLinecap="round" style={{ width: '14px', height: '14px' }}>
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                            <span className="pill-status-text" style={{ color: '#f87171' }}>{cap(statusMessage, 40) || 'Error'}</span>
                        </div>
                    );
                }
                
                // Fully expanded state - shows input selector + minimize button
                if (isFullyExpanded && state === 'idle') {
                    return (
                        <div className="pill-expanded-content">
                             <button
                                className="pill-mic-button"
                                onClick={(e) => {
                                    e.stopPropagation();
                                    startRecording();
                                    setIsExpanded(true);
                                    setIsHovered(false);
                                }}
                                title="Start Recording"
                                style={{ width: '20px', height: '20px' }}
                            >
                                <svg viewBox="0 0 24 24" fill="white" stroke="white" strokeWidth="1.5">
                                    <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" fill="white"/>
                                    <path d="M19 11v1a7 7 0 0 1-14 0v-1" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round"/>
                                    <line x1="12" y1="19" x2="12" y2="22" stroke="white" strokeWidth="1.5" strokeLinecap="round"/>
                                </svg>
                            </button>
                            
                            <select
                                value={selectedMic}
                                onChange={(e) => setSelectedMic(e.target.value)}
                                className="pill-input-selector"
                                onClick={(e) => e.stopPropagation()}
                                style={{ maxWidth: '150px' }}
                            >
                                {devices.map(device => (
                                    <option key={device.deviceId} value={device.deviceId}>
                                        {device.label}
                                    </option>
                                ))}
                            </select>

                            <button
                                className="pill-menu-button"
                                onClick={(e) => {
                                    e.stopPropagation();
                                    openMainWindow();
                                }}
                                title="Open Dashboard"
                                style={{ width: '20px', height: '20px' }}
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeJoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                    <line x1="9" y1="3" x2="9" y2="21" />
                                </svg>
                            </button>

                            <button
                                className="pill-minimize-button"
                                onClick={(e) => {
                                    e.stopPropagation();
                                    setIsFullyExpanded(false);
                                    setIsHovered(false);
                                }}
                                title="Minimize"
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round">
                                    <line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                            </button>

                            {/* Close the pill = quit Echo. Bigger + red so it's a clear, hittable target. */}
                            <button
                                className="pill-close-button"
                                onClick={(e) => {
                                    e.stopPropagation();
                                    if (window.electron?.ipcRenderer) window.electron.ipcRenderer.send('app-quit');
                                }}
                                title="Quit Echo"
                                style={{ marginLeft: '4px' }}
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="#f87171" strokeWidth="2.5" strokeLinecap="round">
                                    <line x1="6" y1="6" x2="18" y2="18"/>
                                    <line x1="6" y1="18" x2="18" y2="6"/>
                                </svg>
                            </button>
                        </div>
                    );
                }
                
                // Hover-expanded state - shows mic button + three dots menu
                if (isHovered && !isExpanded && !isFullyExpanded && state === 'idle') {
                    return (
                        <div className="pill-hover-content">
                            <button
                                className="pill-mic-button"
                                onClick={(e) => {
                                    e.stopPropagation();
                                    startRecording();
                                    setIsExpanded(true);
                                    setIsHovered(false);
                                }}
                                title="Start Recording"
                            >
                                <svg viewBox="0 0 24 24" fill="white" stroke="white" strokeWidth="1.5">
                                    <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" fill="white"/>
                                    <path d="M19 11v1a7 7 0 0 1-14 0v-1" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round"/>
                                    <line x1="12" y1="19" x2="12" y2="22" stroke="white" strokeWidth="1.5" strokeLinecap="round"/>
                                </svg>
                            </button>
                            <button
                                className="pill-menu-button"
                                onClick={(e) => {
                                    e.stopPropagation();
                                    console.log('[Pill] Three-dots menu clicked, setting isFullyExpanded=true');
                                    setIsFullyExpanded(true);
                                    setIsHovered(false);
                                    // Immediately send IPC to expand window
                                    if (window.electron?.ipcRenderer) {
                                        console.log('[Pill] Sending immediate pill-expand 350');
                                        window.electron.ipcRenderer.send('pill-expand', 350);
                                    }
                                }}
                                title="Settings"
                            >
                                <svg viewBox="0 0 24 24" fill="white">
                                    <circle cx="12" cy="5" r="2"/>
                                    <circle cx="12" cy="12" r="2"/>
                                    <circle cx="12" cy="19" r="2"/>
                                </svg>
                            </button>
                        </div>
                    );
                }
                
                // Compact state shows nothing
                return null;
            };

            // Handle click based on state
            const handleClick = () => {
                // Only handle clicks for recording state (to stop recording)
                if (state === 'recording') {
                    stopRecording();
                }
                // For idle state, hover interactions handle everything
            };

            // Single pill that animates between all states
            return (
                <div className="pill-wrapper">
                    <div
                        className={`pill-container ${getPillClass()}`}
                        onMouseEnter={() => state === 'idle' && !isFullyExpanded && setIsHovered(true)}
                        onMouseLeave={() => !isFullyExpanded && setIsHovered(false)}
                        onClick={handleClick}
                        title={state === 'recording' ? 'Click to stop' : ''}
                    >
                        {renderContent()}
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const platform = (window.electron && window.electron.platform) || 'darwin';
            const isMac = platform === 'darwin';
            const [hasApiKey, setHasApiKey] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);
            const [currentText, setCurrentText] = useState('');
            const [currentFilename, setCurrentFilename] = useState('');
            const [history, setHistory] = useState([]);
            const [selectedHistory, setSelectedHistory] = useState(null);
            const [model, setModel] = useState('whisper-large-v3-turbo');
            const [selectedMic, setSelectedMic] = useState('');
            const [toast, setToast] = useState(null);
            const [recordingTime, setRecordingTime] = useState(0);
            const [copiedText, setCopiedText] = useState(false);
            // Persisted theme preference — load saved choice, default to dark
            // (matches Echo's branding) instead of starting in light then flashing.
            const [isDarkMode, setIsDarkMode] = useState(() => {
                try {
                    const saved = localStorage.getItem('echo_theme');
                    if (saved === 'light') return false;
                    if (saved === 'dark') return true;
                } catch (_) {}
                return true; // default dark
            });
            useEffect(() => {
                try { localStorage.setItem('echo_theme', isDarkMode ? 'dark' : 'light'); } catch (_) {}
            }, [isDarkMode]);
            const [showOlderHistory, setShowOlderHistory] = useState(false);
            const [historyFilter, setHistoryFilter] = useState('all');
            const [showFeedback, setShowFeedback] = useState(false);
            
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const streamRef = useRef(null);
            const timerRef = useRef(null);

            useEffect(() => {
                checkApiKey();
                loadHistory();
                // Best-effort usage ping (Tariq #3). No-ops server-side when
                // analytics/cloud is unconfigured, so v1 behaviour is unchanged.
                authedFetch('/api/event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event: 'app_open' })
                }).catch(() => {});
            }, []);

            useEffect(() => {
                if (isRecording) {
                    timerRef.current = setInterval(() => {
                        setRecordingTime(t => t + 1);
                    }, 1000);
                } else {
                    setRecordingTime(0);
                    if (timerRef.current) {
                        clearInterval(timerRef.current);
                    }
                }
                return () => {
                    if (timerRef.current) {
                        clearInterval(timerRef.current);
                    }
                };
            }, [isRecording]);

            const checkApiKey = async () => {
                try {
                    const response = await fetch('/api/settings/api-key');
                    const data = await response.json();
                    setHasApiKey(data.has_api_key);
                    if (!data.has_api_key) {
                        setShowSettings(true);
                    }
                } catch (err) {
                    console.error('Error checking API key:', err);
                }
            };

            const loadHistory = async () => {
                try {
                    const response = await authedFetch('/api/history');
                    const data = await response.json();
                    setHistory(data);
                } catch (err) {
                    console.error('Error loading history:', err);
                }
            };

            const toggleRecording = async () => {
                if (!hasApiKey) {
                    setShowSettings(true);
                    return;
                }

                if (!isRecording) {
                    await startRecording();
                } else {
                    stopRecording();
                }
            };

            const startRecording = async () => {
                try {
                    const constraints = {
                        audio: selectedMic ? { deviceId: { exact: selectedMic } } : true
                    };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    streamRef.current = stream;
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) {
                            audioChunksRef.current.push(event.data);
                        }
                    };

                    mediaRecorderRef.current.onstop = async () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        console.log('Recording stopped. Blob size:', audioBlob.size, 'bytes');
                        await transcribeAudio(audioBlob);
                    };

                    // Request data every 10 seconds to prevent chunking issues
                    mediaRecorderRef.current.start(10000);
                    setIsRecording(true);
                    setCurrentText('');
                    setCurrentFilename('');
                    setSelectedHistory(null);
                } catch (error) {
                    setToast({ message: 'Error accessing microphone: ' + error.message, type: 'error' });
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    streamRef.current?.getTracks().forEach(track => track.stop());
                    setIsRecording(false);
                    setIsProcessing(true);
                }
            };

            const transcribeAudio = async (audioBlob) => {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                formData.append('model', model);

                try {
                    const response = await authedFetch('/api/transcribe', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        setCurrentText(data.text);
                        setCurrentFilename(data.filename || '');
                        setToast({ message: 'Transcription complete!', type: 'success' });
                        loadHistory();
                    } else {
                        throw new Error(data.error || 'Transcription failed');
                    }
                } catch (error) {
                    setToast({ message: 'Error: ' + error.message, type: 'error' });
                } finally {
                    setIsProcessing(false);
                }
            };

            // Re-transcribe the last recording on the server without re-recording.
            const retryLast = async () => {
                setIsProcessing(true);
                try {
                    const response = await authedFetch('/api/retry', { method: 'POST' });
                    const data = await response.json();
                    if (data.success) {
                        setSelectedHistory(null);
                        setCurrentText(data.text);
                        setToast({ message: 'Re-transcribed!', type: 'success' });
                        loadHistory();
                    } else {
                        throw new Error(data.error || 'Retry failed');
                    }
                } catch (error) {
                    setToast({ message: 'Retry: ' + error.message, type: 'error' });
                } finally {
                    setIsProcessing(false);
                }
            };

            const copyText = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    setCopiedText(true);
                    setToast({ message: 'Copied to clipboard!', type: 'success' });
                    setTimeout(() => setCopiedText(false), 2000);
                });
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            const formatTimestamp = (timestamp) => {
                const date = new Date(
                    timestamp.substring(0, 4),
                    timestamp.substring(4, 6) - 1,
                    timestamp.substring(6, 8),
                    timestamp.substring(9, 11),
                    timestamp.substring(11, 13),
                    timestamp.substring(13, 15)
                );
                
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMs / 3600000);
                const diffDays = Math.floor(diffMs / 86400000);
                
                if (diffMins < 60) return `${diffMins} min ago`;
                if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
                if (diffDays === 1) return 'Yesterday';
                if (diffDays < 7) return `${diffDays} days ago`;
                return date.toLocaleDateString();
            };

            const parseTimestamp = (ts) => {
                if (!ts || ts.length < 15) return new Date(0);
                return new Date(
                    ts.substring(0,4), ts.substring(4,6)-1, ts.substring(6,8),
                    ts.substring(9,11), ts.substring(11,13), ts.substring(13,15)
                );
            };

            // #3: always sort newest-first (timestamps are YYYYMMDD_HHMMSS, so string
            // compare = chronological). #7: filter by time window (minutes / today / all).
            const filteredHistory = (() => {
                const sorted = [...history].sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
                if (historyFilter === 'all') return sorted;
                const now = new Date();
                let cutoff;
                if (historyFilter === 'today') {
                    cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                } else {
                    cutoff = new Date(now.getTime() - parseInt(historyFilter, 10) * 60000); // N minutes ago
                }
                return sorted.filter(item => parseTimestamp(item.timestamp) >= cutoff);
            })();

            return (
                <div className={`h-screen w-screen flex flex-col overflow-hidden ${isDarkMode ? 'bg-gray-900 text-white' : 'bg-gray-50 text-gray-900'}`}>

                    {/* ── Title bar ── */}
                    <div
                        className={`flex items-center justify-between px-4 h-10 border-b flex-shrink-0 ${isDarkMode ? 'bg-gray-900 border-gray-800' : 'bg-white border-gray-200'}`}
                        // #2: on macOS the traffic-light buttons sit top-left, so pad the
                        // logo to the right so they don't overlap it.
                        style={{ WebkitAppRegion: 'drag', WebkitUserSelect: 'none',
                                 paddingLeft: (window.electron && window.electron.platform === 'darwin') ? '78px' : undefined }}
                    >
                        <span className={`flex items-center gap-2 text-sm font-semibold ${isDarkMode ? 'text-gray-300' : 'text-gray-600'}`}>
                            Echo
                        </span>
                        <button
                            onClick={() => setIsDarkMode(!isDarkMode)}
                            className={`text-base transition-colors ${isDarkMode ? 'text-yellow-400 hover:text-yellow-300' : 'text-gray-400 hover:text-gray-600'}`}
                            style={{ WebkitAppRegion: 'no-drag' }}
                            title="Toggle dark / light mode"
                        >
                            {isDarkMode ? '☀️' : '🌙'}
                        </button>
                    </div>

                    {/* ── Two-panel body ── */}
                    <div className="flex flex-1 overflow-hidden">

                        {/* ── Left sidebar ── */}
                        <div className={`w-80 flex-shrink-0 flex flex-col border-r ${isDarkMode ? 'bg-gray-900 border-gray-800' : 'bg-white border-gray-200'}`}>

                            {/* Logo + buttons */}
                            <div className="px-5 pt-6 pb-4 flex-shrink-0">
                                <div className="flex items-center gap-3 mb-6">
                                    <EchoLogo size={44} />
                                    <div>
                                        <h1 className="text-xl font-bold leading-tight">Echo</h1>
                                        <p className={`text-xs ${isDarkMode ? 'text-gray-500' : 'text-gray-400'}`}>Speech to Text</p>
                                    </div>
                                </div>

                                <button
                                    onClick={() => { setSelectedHistory(null); toggleRecording(); }}
                                    disabled={!hasApiKey || isProcessing}
                                    className="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm font-semibold text-white transition-all disabled:opacity-40 disabled:cursor-not-allowed mb-2"
                                    style={{ backgroundColor: isRecording ? '#dc2626' : (isDarkMode ? '#27272a' : '#0f172a') }}
                                >
                                    {isRecording ? '⏹ Stop Recording' : isProcessing ? '⌛ Processing…' : '+ New Recording'}
                                </button>

                                <button
                                    onClick={() => setShowSettings(true)}
                                    className={`w-full flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-colors ${isDarkMode ? 'text-gray-400 hover:bg-gray-800 hover:text-white' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-800'}`}
                                >
                                    ⚙️ Settings
                                </button>

                                <button
                                    onClick={() => setShowFeedback(true)}
                                    className={`w-full flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-colors ${isDarkMode ? 'text-gray-400 hover:bg-gray-800 hover:text-white' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-800'}`}
                                >
                                    💬 Feedback
                                </button>

                                {!hasApiKey && (
                                    <div className={`mt-3 px-3 py-2 rounded-lg text-xs ${isDarkMode ? 'bg-yellow-900 bg-opacity-30 text-yellow-400' : 'bg-yellow-50 text-yellow-700 border border-yellow-200'}`}>
                                        ⚠️ Add your Groq API key in Settings to get started.
                                    </div>
                                )}
                            </div>

                            {/* Recordings list */}
                            <div className={`border-t flex-1 flex flex-col overflow-hidden ${isDarkMode ? 'border-gray-800' : 'border-gray-100'}`}>
                                <div className="px-3 pt-3 pb-1">
                                    <select
                                        value={historyFilter}
                                        onChange={(e) => setHistoryFilter(e.target.value)}
                                        className={`w-full text-xs rounded-lg border px-2 py-1.5 outline-none cursor-pointer ${isDarkMode ? 'bg-gray-800 border-gray-700 text-gray-300' : 'bg-white border-gray-200 text-gray-600'}`}
                                    >
                                        <option value="all">All time</option>
                                        <option value="today">Today</option>
                                        <option value="300">Last 5 hours</option>
                                        <option value="60">Last 1 hour</option>
                                        <option value="30">Last 30 minutes</option>
                                        <option value="10">Last 10 minutes</option>
                                        <option value="5">Last 5 minutes</option>
                                        <option value="1">Last 1 minute</option>
                                    </select>
                                </div>
                                {filteredHistory.length === 0 ? (
                                    <p className={`px-5 py-6 text-xs text-center ${isDarkMode ? 'text-gray-600' : 'text-gray-400'}`}>No recordings in this range</p>
                                ) : (
                                    <div className="px-3 pb-4 space-y-1 overflow-y-auto flex-1">
                                        {filteredHistory.map((item, i) => (
                                            <div
                                                key={item.timestamp + '-' + i}
                                                onClick={() => { setSelectedHistory(item); setCurrentText(''); }}
                                                className={`group rounded-xl px-3 py-2.5 cursor-pointer transition-colors border ${
                                                    selectedHistory?.timestamp === item.timestamp
                                                        ? (isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-blue-50 border-blue-200')
                                                        : (isDarkMode ? 'border-transparent hover:bg-gray-800 hover:border-gray-700' : 'border-transparent hover:bg-gray-50 hover:border-gray-200')
                                                }`}
                                            >
                                                <div className="flex items-center justify-between mb-0.5">
                                                    <span className={`text-xs ${isDarkMode ? 'text-gray-500' : 'text-gray-400'}`}>{formatTimestamp(item.timestamp)}</span>
                                                    <span className="text-xs text-amber-500">⚡</span>
                                                </div>
                                                <p
                                                    className={`text-xs leading-snug ${isDarkMode ? 'text-gray-300' : 'text-gray-600'}`}
                                                    style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}
                                                >
                                                    {item.text}
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* ── Right panel ── */}
                        <div className={`flex-1 flex flex-col overflow-hidden ${isDarkMode ? 'bg-gray-900' : 'bg-white'}`}>

                            {/* Panel top bar: title + mic/model selectors */}
                            <div className={`flex items-center justify-between px-6 py-3 border-b flex-shrink-0 ${isDarkMode ? 'border-gray-800' : 'border-gray-200'}`}>
                                <span className={`text-sm font-semibold ${isDarkMode ? 'text-gray-200' : 'text-gray-700'}`}>
                                    {isRecording ? `🔴 Recording · ${formatTime(recordingTime)}` : isProcessing ? '⌛ Transcribing…' : selectedHistory ? 'Recording' : 'New Recording'}
                                </span>
                                <div className="flex items-center gap-2">
                                    <MicSelector
                                        value={selectedMic}
                                        onValueChange={setSelectedMic}
                                        disabled={isRecording || isProcessing}
                                        isDarkMode={isDarkMode}
                                    />
                                    <select
                                        value={model}
                                        onChange={(e) => setModel(e.target.value)}
                                        disabled={isRecording || isProcessing}
                                        className={`px-3 py-2 border rounded-lg text-sm font-medium focus:outline-none focus:ring-2 disabled:opacity-50 ${isDarkMode ? 'bg-gray-800 border-gray-700 text-white focus:ring-gray-600' : 'bg-white border-gray-300 text-gray-900 focus:ring-blue-500'}`}
                                    >
                                        <option value="whisper-large-v3-turbo">⚡ Turbo (v3-turbo)</option>
                                        <option value="whisper-large-v3">🎯 Large (v3)</option>
                                        <option value="distil-whisper-large-v3-en">🚀 Distil EN</option>
                                    </select>
                                </div>
                            </div>

                            {/* Panel body */}
                            <div className="flex-1 flex flex-col items-center justify-center p-8 overflow-y-auto">
                                {(selectedHistory || (currentText && !isRecording && !isProcessing)) ? (
                                    /* Transcript view */
                                    <div className="w-full max-w-2xl">
                                        <div className={`relative rounded-xl border p-6 ${isDarkMode ? 'border-gray-800 bg-gray-800' : 'border-gray-100 bg-gray-50'}`}>
                                            {/* #8: Retry at the TOP-RIGHT corner of the transcription */}
                                            {!selectedHistory && currentText && (
                                                <button
                                                    onClick={retryLast}
                                                    disabled={isProcessing}
                                                    title="Re-transcribe the last recording without recording again"
                                                    className={`absolute top-3 right-3 text-xs px-3 py-1.5 rounded-lg font-medium transition-colors disabled:opacity-50 ${isDarkMode ? 'bg-gray-700 text-gray-200 hover:bg-gray-600' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                                >
                                                    🔄 Retry
                                                </button>
                                            )}
                                            <p className={`text-sm leading-relaxed whitespace-pre-wrap pr-20 ${isDarkMode ? 'text-gray-100' : 'text-gray-800'}`}>
                                                {selectedHistory ? selectedHistory.text : currentText}
                                            </p>
                                            <div className="flex items-center justify-between mt-5">
                                                <span className={`text-xs ${isDarkMode ? 'text-gray-500' : 'text-gray-400'}`}>
                                                    {selectedHistory ? formatTimestamp(selectedHistory.timestamp) : 'Just now'}
                                                </span>
                                                <button
                                                    onClick={() => copyText(selectedHistory ? selectedHistory.text : currentText)}
                                                    className={`text-xs px-4 py-1.5 rounded-lg font-medium transition-colors ${isDarkMode ? 'bg-gray-700 text-gray-200 hover:bg-gray-600' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                                >
                                                    {copiedText ? '✓ Copied' : 'Copy Text'}
                                                </button>
                                            </div>
                                        </div>
                                        {selectedHistory && (
                                            <button
                                                onClick={() => setSelectedHistory(null)}
                                                className={`mt-3 text-xs ${isDarkMode ? 'text-gray-500 hover:text-gray-400' : 'text-gray-400 hover:text-gray-600'}`}
                                            >
                                                ← New Recording
                                            </button>
                                        )}
                                    </div>
                                ) : (
                                    /* Idle / recording — big mic button */
                                    <div className="text-center">
                                        <button
                                            onClick={toggleRecording}
                                            disabled={!hasApiKey || isProcessing}
                                            className="w-36 h-36 rounded-full flex items-center justify-center text-5xl shadow-2xl transition-all transform hover:scale-105 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none mx-auto"
                                            style={{ backgroundColor: isRecording ? '#dc2626' : (isDarkMode ? '#18181b' : '#0f172a') }}
                                        >
                                            {isProcessing ? '⌛' : isRecording ? '⏹' : '🎙️'}
                                        </button>
                                        <p className={`mt-5 text-sm ${isDarkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                                            {isRecording
                                                ? `Recording ${formatTime(recordingTime)} · click to stop`
                                                : isProcessing ? 'Transcribing…'
                                                : 'Click to start recording'}
                                        </p>
                                        {!hasApiKey && (
                                            <p className={`mt-2 text-xs ${isDarkMode ? 'text-red-400' : 'text-red-500'}`}>
                                                Configure your Groq API key in Settings first
                                            </p>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <SettingsDialog
                        isOpen={showSettings}
                        onClose={() => setShowSettings(false)}
                        onSave={() => {
                            checkApiKey();
                            setToast({ message: 'Settings saved', type: 'success' });
                        }}
                        isDarkMode={isDarkMode}
                        onToggleTheme={() => setIsDarkMode(v => !v)}
                    />

                    <FeedbackModal
                        isOpen={showFeedback}
                        onClose={() => setShowFeedback(false)}
                        isDarkMode={isDarkMode}
                    />

                    {toast && (
                        <Toast
                            message={toast.message}
                            type={toast.type}
                            onClose={() => setToast(null)}
                        />
                    )}
                </div>
            );
        }

        // Simple hash-based routing
        function RouterApp() {
            const [route, setRoute] = useState(window.location.hash);
            
            useEffect(() => {
                const handleHashChange = () => {
                    setRoute(window.location.hash);
                };
                
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);
            
            console.log('Current route:', route);
            
            // Route based on hash
            if (route === '#/pill') {
                return <Pill />;
            }
            if (route === '#/login') {
                return <LoginScreen />;
            }

            return <App />;
        }

        ReactDOM.render(<RouterApp />, document.getElementById('root'));
    </script>
    {% endraw %}
</body>
</html>
